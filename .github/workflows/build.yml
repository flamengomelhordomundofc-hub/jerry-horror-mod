              // Fase 11: Quando o jogador abre um bau enquanto Jerry esta sorrindo na cama -> Jerry levanta em 2 patas!
              @SubscribeEvent
              public void onContainerOpen(PlayerContainerEvent.Open event) {
                  if (event.getEntity() instanceof ServerPlayer sp && currentPhase == 11) {
                      JerryEntity jerry = findJerry(sp.serverLevel(), sp.blockPosition());
                      if (jerry != null && jerry.getAnimState() == JerryEntity.ANIM_SLEEP_BED) {
                          jerry.setFaceState(JerryEntity.FACE_SMILE);
                          jerry.setAnimState(JerryEntity.ANIM_STAND_UPRIGHT);
                          sp.serverLevel().playSound(null, jerry.blockPosition(), SoundEvents.AMBIENT_CAVE.value(), SoundSource.HOSTILE, 2.0F, 0.45F);
                          sp.sendSystemMessage(Component.literal("§4...Olhe para a cama."));
                      }
                  }
              }

              @SubscribeEvent
              public void onPlayerTick(TickEvent.PlayerTickEvent event) {
                  if (event.phase != TickEvent.Phase.END || !(event.player instanceof ServerPlayer sp)) return;
                  ServerLevel sl = sp.serverLevel();
                  phaseTimer++;

                  // Detectar quando o jogador deita na cama (Fases 4 e 7 acordam no meio da noite!)
                  if (sp.isSleeping() && sp.getSleepTimer() >= 35) {
                      lastBedPos = sp.blockPosition();
                      if (currentPhase == 4) {
                          sp.stopSleeping();
                          sl.setDayTime(18000);
                          sl.playSound(null, sp.blockPosition(), SoundEvents.WOODEN_DOOR_OPEN, SoundSource.BLOCKS, 1.2F, 0.7F);
                          JerryEntity jerry = findJerry(sl, sp.blockPosition());
                          if (jerry != null) {
                              BlockPos chestPos = findNearestBlock(sl, sp.blockPosition(), 12, ChestBlock.class);
                              if (chestPos != null) {
                                  jerry.teleportTo(chestPos.getX() + 0.5D, chestPos.getY(), chestPos.getZ() + 1.2D);
                                  jerry.setAnimState(JerryEntity.ANIM_DIG_CHEST);
                              } else {
                                  jerry.setAnimState(JerryEntity.ANIM_MARK_TERRITORY);
                              }
                              jerry.setFaceState(JerryEntity.FACE_CREEPY);
                          }
                          sp.sendSystemMessage(Component.literal("§cVoce acordou no meio da noite com barulhos estranhos na casa..."));
                      } else if (currentPhase == 7) {
                          sp.stopSleeping();
                          sl.setDayTime(18500);
                          triggerTomMurderScene(sl, sp);
                      }
                  }

                  // Fase 9/10: Se jogador entrar na sala do ritual -> Spawna Entidade Sombria!
                  if ((currentPhase == 9 || currentPhase == 10) && BunkerBuilder.lastRitualCenter != null && !demonSpawned) {
                      if (sp.blockPosition().distSqr(BunkerBuilder.lastRitualCenter) < 30.0D) {
                          currentPhase = 10;
                          demonSpawned = true;
                          ShadowDemonEntity demon = ModEntities.SHADOW_DEMON.get().create(sl);
                          if (demon != null) {
                              BlockPos spPos = BunkerBuilder.lastRitualCenter.offset(0, 0, -4);
                              demon.moveTo(spPos.getX() + 0.5D, spPos.getY(), spPos.getZ() + 0.5D, 0.0F, 0.0F);
                              sl.addFreshEntity(demon);
                          }
                          sl.playSound(null, sp.blockPosition(), SoundEvents.WARDEN_ROAR, SoundSource.HOSTILE, 1.5F, 0.5F);
                          sp.sendSystemMessage(Component.literal("§4§lCORRA! ALGO ENTROU NA SALA DO RITUAL! FUJA PELO TUNEL NOS FUNDOS!"));
                      }
                  }

                  // Se o jogador escapou da sala do ritual para a superficie na Fase 10 -> Inicia Fase 11 (Final)!
                  if (currentPhase == 10 && demonSpawned && BunkerBuilder.lastRitualCenter != null) {
                      if (sp.blockPosition().getY() >= BunkerBuilder.lastRitualCenter.getY() + 9) {
                          List<ShadowDemonEntity> demons = sl.getEntitiesOfClass(ShadowDemonEntity.class, new AABB(sp.blockPosition()).inflate(64));
                          for (ShadowDemonEntity d : demons) d.discard();
                          startPhase(sl, sp, 11);
                      }
                  }

                  // Fase 11: Se jogador nao tem bau, olhar para longe por 4 segundos tambem faz Jerry levantar em 2 patas
                  if (currentPhase == 11 && phaseTimer % 40 == 0) {
                      JerryEntity jerry = findJerry(sl, sp.blockPosition());
                      if (jerry != null && jerry.getAnimState() == JerryEntity.ANIM_SLEEP_BED && jerry.distanceTo(sp) < 12.0D) {
                          double dot = sp.getLookAngle().normalize().dot(jerry.position().subtract(sp.position()).normalize());
                          if (dot < -0.2D) {
                              jerry.setFaceState(JerryEntity.FACE_SMILE);
                              jerry.setAnimState(JerryEntity.ANIM_STAND_UPRIGHT);
                              sl.playSound(null, jerry.blockPosition(), SoundEvents.AMBIENT_CAVE.value(), SoundSource.HOSTILE, 2.0F, 0.45F);
                              sp.sendSystemMessage(Component.literal("§4...Nao olhe para tras."));
                          }
                      }
                  }
              }

              public static void startPhase(ServerLevel sl, ServerPlayer sp, int phase) {
                  currentPhase = phase;
                  phaseTimer = 0;
                  JerryEntity jerry = findJerry(sl, sp.blockPosition());
                  if (jerry == null) jerry = spawnJerry(sl, sp.blockPosition().offset(2, 0, 2));

                  switch (phase) {
                      case 1 -> {
                          // 00:00 - 02:35: Fase amigavel (truques, coletar madeira/flor/ferro)
                          jerry.setFaceState(JerryEntity.FACE_HAPPY);
                          jerry.setAnimState(JerryEntity.ANIM_NORMAL);
                          sp.getInventory().add(new ItemStack(Items.BONE, 8));
                          sp.sendSystemMessage(Component.literal("§a[Fase 1] Jerry e seu melhor amigo! Digite no chat: 'rolar', 'flor', 'madeira', 'ferro'. (Use /jerry next para avancar a historia)"));
                      }
                      case 2 -> {
                          // 02:55 - 03:35: Pocas de sangue na casa + olhos realistas encarando
                          BlockPos center = sp.blockPosition();
                          for (int i = 0; i < 6; i++) {
                              BlockPos bp = center.offset(sl.random.nextInt(7) - 3, 0, sl.random.nextInt(7) - 3);
                              if (sl.getBlockState(bp).isAir() && !sl.getBlockState(bp.below()).isAir()) {
                                  sl.setBlock(bp, ModBlocks.BLOOD_PUDDLE.get().defaultBlockState(), 3);
                              }
                          }
                          jerry.setFaceState(JerryEntity.FACE_CREEPY);
                          jerry.setAnimState(JerryEntity.ANIM_NORMAL);
                          sl.playSound(null, sp.blockPosition(), SoundEvents.AMBIENT_CAVE.value(), SoundSource.HOSTILE, 1.5F, 0.6F);
                          sp.sendSystemMessage(Component.literal("§c[Fase 2] Por que tem tanto sangue espalhado por aqui?! Pergunte 'por que tem sangue' no chat..."));
                      }
                      case 3 -> {
                          // 04:20 - 05:25: Empurrar no penhasco + esmagar osso agressivamente
                          jerry.setFaceState(JerryEntity.FACE_CREEPY);
                          jerry.setAnimState(JerryEntity.ANIM_NORMAL);
                          sp.getInventory().add(new ItemStack(Items.BONE, 3));
                          sp.sendSystemMessage(Component.literal("§c[Fase 3] Jerry esta estranho... Chegue perto dele (ele vai te empurrar!) ou tente dar um osso para ele."));
                      }
                      case 4 -> {
                          // 05:50 - 07:45: Jerry toma sua cama, marca territorio e mexe nos baus a noite
                          BlockPos bed = findNearestBlock(sl, sp.blockPosition(), 16, BedBlock.class);
                          if (bed != null) {
                              lastBedPos = bed;
                              jerry.teleportTo(bed.getX() + 0.5D, bed.getY() + 0.6D, bed.getZ() + 0.5D);
                          }
                          jerry.setFaceState(JerryEntity.FACE_CREEPY);
                          jerry.setAnimState(JerryEntity.ANIM_SLEEP_BED);
                          sl.setDayTime(13500);
                          sp.sendSystemMessage(Component.literal("§c[Fase 4] Jerry deitou na sua cama! Clique nele ou tente dormir na cama..."));
                      }
                      case 5 -> {
                          // 07:50 - 09:00: Nascer do sol - Jerry sentado igual humano na colina
                          sl.setDayTime(23150);
                          BlockPos hill = sp.blockPosition().offset(6, 0, 6);
                          jerry.teleportTo(hill.getX() + 0.5D, sp.getY(), hill.getZ() + 0.5D);
                          jerry.setFaceState(JerryEntity.FACE_CREEPY);
                          jerry.setAnimState(JerryEntity.ANIM_HUMAN_SIT);
                          sl.playSound(null, jerry.blockPosition(), SoundEvents.AMBIENT_CAVE.value(), SoundSource.HOSTILE, 1.4F, 0.55F);
                          sp.sendSystemMessage(Component.literal("§c[Fase 5] O sol esta nascendo... Olhe como o Jerry esta sentado la fora."));
                      }
                      case 6 -> {
                          // 09:10 - 11:30: Adotando o Tom (coleira azul) e ciumes do Jerry
                          jerry.setAnimState(JerryEntity.ANIM_NORMAL);
                          jerry.setFaceState(JerryEntity.FACE_CREEPY);
                          if (findTom(sl, sp.blockPosition()) == null) {
                              spawnTom(sl, sp.blockPosition().offset(-2, 0, 2));
                          }
                          sp.sendSystemMessage(Component.literal("§b[Fase 6] Voce adotou o Tom (coleira azul)! Diga 'abracar' ou 'favorito' no chat para ver a reacao do Jerry..."));
                      }
                      case 7 -> {
                          // 11:45 - 13:30: Noite do assassinato do Tom!
                          sl.setDayTime(14000);
                          triggerTomMurderScene(sl, sp);
                      }
                      case 8 -> {
                          // 13:35 - 15:00: Enterro na chuva + invasao de esqueletos + cova violada!
                          sl.setWeatherParameters(0, 6000, true, false);
                          sl.setDayTime(16000);
                          for (int i = 0; i < 3; i++) {
                              Skeleton sk = EntityType.SKELETON.create(sl);
                              if (sk != null) {
                                  sk.moveTo(sp.getX() + (i * 3 - 3), sp.getY(), sp.getZ() + 8, 0, 0);
                                  sl.addFreshEntity(sk);
                              }
                          }
                          if (lastGravePos != null) {
                              sl.setBlock(lastGravePos, Blocks.AIR.defaultBlockState(), 3);
                              sl.setBlock(lastGravePos.below(), Blocks.AIR.defaultBlockState(), 3);
                              sl.setBlock(lastGravePos.offset(1, 0, 0), ModBlocks.BLOOD_PUDDLE.get().defaultBlockState(), 3);
                          }
                          sp.sendSystemMessage(Component.literal("§4[Fase 8] Esqueletos atacaram! E o tumulo do Tom foi CAVADO E ESTA VAZIO..."));
                      }
                      case 9 -> {
                          // 15:10 - 16:05: Trilha de sangue levando ao Bunker Subterraneo + Sala do Ritual
                          demonSpawned = false;
                          BlockPos entrance = sp.blockPosition().offset(0, 0, 6);
                          for (int z = 1; z <= 5; z++) {
                              BlockPos trail = sp.blockPosition().offset(0, 0, z);
                              if (sl.getBlockState(trail).isAir()) {
                                  sl.setBlock(trail, ModBlocks.BLOOD_PUDDLE.get().defaultBlockState(), 3);
                              }
                          }
                          BunkerBuilder.buildBunker(sl, entrance);
                          sp.sendSystemMessage(Component.literal("§4[Fase 9] Siga a trilha de sangue ate a entrada secreta do Bunker subterraneo..."));
