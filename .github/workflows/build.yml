                              BunkerBuilder.buildBunker(sl, sp.blockPosition().offset(0, 0, 6));
                          }
                          demonSpawned = true;
                          ShadowDemonEntity demon = ModEntities.SHADOW_DEMON.get().create(sl);
                          if (demon != null) {
                              demon.moveTo(sp.getX(), sp.getY(), sp.getZ() - 5, 0, 0);
                              sl.addFreshEntity(demon);
                          }
                          sl.playSound(null, sp.blockPosition(), SoundEvents.WARDEN_ROAR, SoundSource.HOSTILE, 1.5F, 0.5F);
                          sp.sendSystemMessage(Component.literal("§4§l[Fase 10] A ENTIDADE SOMBRIA ESTA TE PERSEGUINDO! FUJA PARA A SUPERFICIE!"));
                      }
                      case 11 -> {
                          // 16:45 - 17:25: Final - Jerry sorrindo na cama -> Levanta em 2 patas -> THE END...?
                          BlockPos bed = findNearestBlock(sl, sp.blockPosition(), 24, BedBlock.class);
                          if (bed != null) {
                              jerry.teleportTo(bed.getX() + 0.5D, bed.getY() + 0.6D, bed.getZ() + 0.5D);
                          } else {
                              jerry.teleportTo(sp.getX() + 3.0D, sp.getY(), sp.getZ() + 3.0D);
                          }
                          jerry.setFaceState(JerryEntity.FACE_SMILE);
                          jerry.setAnimState(JerryEntity.ANIM_SLEEP_BED);
                          sl.playSound(null, sp.blockPosition(), SoundEvents.AMBIENT_CAVE.value(), SoundSource.HOSTILE, 1.5F, 0.5F);
                          sp.sendSystemMessage(Component.literal("§4[Fase 11 - FINAL] Jerry esta deitado na cama... SORRINDO. Abra um bau ou vire de costas para ele..."));
                      }
                  }
              }

              private static void triggerTomMurderScene(ServerLevel sl, ServerPlayer sp) {
                  TomEntity tom = findTom(sl, sp.blockPosition());
                  BlockPos deathPos = (tom != null) ? tom.blockPosition() : sp.blockPosition().offset(5, 0, 0);
                  if (tom != null) tom.discard();

                  // Abrir porta proxima
                  BlockPos door = findNearestBlock(sl, sp.blockPosition(), 14, DoorBlock.class);
                  if (door != null) {
                      BlockState ds = sl.getBlockState(door);
                      if (ds.hasProperty(DoorBlock.OPEN)) {
                          sl.setBlock(door, ds.setValue(DoorBlock.OPEN, true), 3);
                      }
                  }

                  // Pocas de sangue + Tom Morto
                  for (int dx = -1; dx <= 1; dx++) {
                      for (int dz = -1; dz <= 1; dz++) {
                          BlockPos bp = deathPos.offset(dx, 0, dz);
                          if (sl.getBlockState(bp).isAir()) {
                              sl.setBlock(bp, ModBlocks.BLOOD_PUDDLE.get().defaultBlockState(), 3);
                          }
                      }
                  }
                  DeadTomEntity deadTom = ModEntities.DEAD_TOM.get().create(sl);
                  if (deadTom != null) {
                      deadTom.moveTo(deathPos.getX() + 0.5D, deathPos.getY(), deathPos.getZ() + 0.5D, 0, 0);
                      sl.addFreshEntity(deadTom);
                  }

                  // Jerry fingindo dormir na cama com sangue embaixo!
                  JerryEntity jerry = findJerry(sl, sp.blockPosition());
                  if (jerry != null) {
                      BlockPos bed = findNearestBlock(sl, sp.blockPosition(), 16, BedBlock.class);
                      if (bed != null) {
                          jerry.teleportTo(bed.getX() + 0.5D, bed.getY() + 0.6D, bed.getZ() + 0.5D);
                          if (sl.getBlockState(bed.offset(1, 0, 0)).isAir()) {
                              sl.setBlock(bed.offset(1, 0, 0), ModBlocks.BLOOD_PUDDLE.get().defaultBlockState(), 3);
                          }
                      }
                      jerry.setAnimState(JerryEntity.ANIM_SLEEP_BED);
                      jerry.setFaceState(JerryEntity.FACE_NORMAL);
                  }

                  sl.playSound(null, sp.blockPosition(), SoundEvents.WOLF_DEATH, SoundSource.HOSTILE, 1.5F, 0.7F);
                  sp.getInventory().add(new ItemStack(Items.IRON_SHOVEL, 1));
                  sp.sendSystemMessage(Component.literal("§4[Fase 7] A porta se abriu! O Tom foi morto numa poca de sangue... E o Jerry esta 'dormindo' na cama! (Clique no Jerry e depois clique com a pa no Tom para enterra-lo)"));
              }

              public static void buryTom(ServerLevel sl, ServerPlayer sp, DeadTomEntity deadTom) {
                  BlockPos p = deadTom.blockPosition();
                  lastGravePos = p;
                  deadTom.discard();
                  sl.setBlock(p, Blocks.GRAVEL.defaultBlockState(), 3);
                  sl.setBlock(p.north(), Blocks.COBBLESTONE_WALL.defaultBlockState(), 3);
                  sl.setBlock(p.north().above(), Blocks.TORCH.defaultBlockState(), 3);
                  sp.sendSystemMessage(Component.literal("§7Voce enterrou o Tom... Uma tempestade comecou."));
                  startPhase(sl, sp, 8);
              }

              private static JerryEntity spawnJerry(ServerLevel sl, BlockPos pos) {
                  JerryEntity j = ModEntities.JERRY.get().create(sl);
                  if (j != null) {
                      j.moveTo(pos.getX() + 0.5D, pos.getY(), pos.getZ() + 0.5D, 0, 0);
                      sl.addFreshEntity(j);
                  }
                  return j;
              }

              private static TomEntity spawnTom(ServerLevel sl, BlockPos pos) {
                  TomEntity t = ModEntities.TOM.get().create(sl);
                  if (t != null) {
                      t.moveTo(pos.getX() + 0.5D, pos.getY(), pos.getZ() + 0.5D, 0, 0);
                      sl.addFreshEntity(t);
                  }
                  return t;
              }

              private static JerryEntity findJerry(ServerLevel sl, BlockPos center) {
                  List<JerryEntity> list = sl.getEntitiesOfClass(JerryEntity.class, new AABB(center).inflate(96));
                  return list.isEmpty() ? null : list.get(0);
              }

              private static TomEntity findTom(ServerLevel sl, BlockPos center) {
                  List<TomEntity> list = sl.getEntitiesOfClass(TomEntity.class, new AABB(center).inflate(96));
                  return list.isEmpty() ? null : list.get(0);
              }

              private static void dropItem(ServerLevel sl, BlockPos pos, ItemStack stack) {
                  ItemEntity ie = new ItemEntity(sl, pos.getX() + 0.5D, pos.getY() + 0.5D, pos.getZ() + 0.5D, stack);
                  sl.addFreshEntity(ie);
              }

              private static BlockPos findNearestBlock(ServerLevel sl, BlockPos origin, int radius, Class<?> blockClass) {
                  BlockPos best = null;
                  double bestDist = Double.MAX_VALUE;
                  for (int x = -radius; x <= radius; x++) {
                      for (int y = -4; y <= 4; y++) {
                          for (int z = -radius; z <= radius; z++) {
                              BlockPos p = origin.offset(x, y, z);
                              if (blockClass.isInstance(sl.getBlockState(p).getBlock())) {
                                  double d = p.distSqr(origin);
                                  if (d < bestDist) {
                                      bestDist = d;
                                      best = p;
                                  }
                              }
                          }
                      }
                  }
                  return best;
              }
          }
