              private final ModelPart rightArm;
              private final ModelPart leftArm;
              private final ModelPart rightLeg;
              private final ModelPart leftLeg;

              public ShadowDemonModel(ModelPart root) {
                  this.head = root.getChild("head");
                  this.body = root.getChild("body");
                  this.rightArm = root.getChild("right_arm");
                  this.leftArm = root.getChild("left_arm");
                  this.rightLeg = root.getChild("right_leg");
                  this.leftLeg = root.getChild("left_leg");
              }

              public static LayerDefinition createBodyLayer() {
                  MeshDefinition mesh = new MeshDefinition();
                  PartDefinition root = mesh.getRoot();
                  root.addOrReplaceChild("head", CubeListBuilder.create().texOffs(0, 0).addBox(-4.0F, -8.0F, -4.0F, 8.0F, 8.0F, 8.0F), PartPose.offset(0.0F, -10.0F, 0.0F));
                  root.addOrReplaceChild("body", CubeListBuilder.create().texOffs(16, 16).addBox(-4.0F, 0.0F, -2.0F, 8.0F, 16.0F, 4.0F), PartPose.offset(0.0F, -10.0F, 0.0F));
                  root.addOrReplaceChild("right_arm", CubeListBuilder.create().texOffs(40, 16).addBox(-2.0F, 0.0F, -1.0F, 2.0F, 20.0F, 2.0F), PartPose.offset(-4.0F, -9.0F, 0.0F));
                  root.addOrReplaceChild("left_arm", CubeListBuilder.create().texOffs(40, 16).addBox(0.0F, 0.0F, -1.0F, 2.0F, 20.0F, 2.0F), PartPose.offset(4.0F, -9.0F, 0.0F));
                  root.addOrReplaceChild("right_leg", CubeListBuilder.create().texOffs(0, 16).addBox(-1.0F, 0.0F, -1.0F, 2.0F, 18.0F, 2.0F), PartPose.offset(-2.0F, 6.0F, 0.0F));
                  root.addOrReplaceChild("left_leg", CubeListBuilder.create().texOffs(0, 16).addBox(-1.0F, 0.0F, -1.0F, 2.0F, 18.0F, 2.0F), PartPose.offset(2.0F, 6.0F, 0.0F));
                  return LayerDefinition.create(mesh, 64, 64);
              }

              @Override
              public void setupAnim(ShadowDemonEntity entity, float limbSwing, float limbSwingAmount, float ageInTicks, float netHeadYaw, float headPitch) {
                  head.yRot = netHeadYaw * ((float) Math.PI / 180F);
                  head.zRot = Mth.sin(ageInTicks * 0.2F) * 0.18F;
                  rightLeg.xRot = Mth.cos(limbSwing * 0.6662F) * 1.4F * limbSwingAmount;
                  leftLeg.xRot = Mth.cos(limbSwing * 0.6662F + (float) Math.PI) * 1.4F * limbSwingAmount;
                  rightArm.xRot = -1.2F + Mth.cos(limbSwing * 0.6662F) * 0.6F * limbSwingAmount;
                  leftArm.xRot = -1.2F - Mth.cos(limbSwing * 0.6662F) * 0.6F * limbSwingAmount;
              }

              @Override
              public void renderToBuffer(PoseStack poseStack, VertexConsumer buffer, int packedLight, int packedOverlay, float r, float g, float b, float a) {
                  head.render(poseStack, buffer, packedLight, packedOverlay, r, g, b, a);
                  body.render(poseStack, buffer, packedLight, packedOverlay, r, g, b, a);
                  rightArm.render(poseStack, buffer, packedLight, packedOverlay, r, g, b, a);
                  leftArm.render(poseStack, buffer, packedLight, packedOverlay, r, g, b, a);
                  rightLeg.render(poseStack, buffer, packedLight, packedOverlay, r, g, b, a);
                  leftLeg.render(poseStack, buffer, packedLight, packedOverlay, r, g, b, a);
              }
          }
