🎮 COMO JOGAR TODOS OS ACONTECIMENTOS DO VÍDEO NO MINECRAFT

Depois de colocar o jerryhorrormod-1.0.0.jar na pasta mods do Minecraft 1.20.1
Forge:

  - Começar a história: Domestique qualquer lobo com osso OU digite /jerry
    start.
  - Comandos de voz (digite no chat para aparecer o ícone preto de alto-falante
    em cima do Jerry):
      - rolar (ou roll over) — Jerry dá uma cambalhota 360° no chão!
      - flor / madeira / ferro — Jerry busca flor, madeira e ferro para você!
      - por que tem sangue — Jerry trava e te encara com os olhos realistas
        arregalados!
      - abracar — Tom (coleira azul) abraça o Jerry com corações enquanto Jerry
        o odeia!
      - favorito — Jerry rosna de ciúmes quando você elogia o Tom!
  - Avançar pelas 11 cenas exatas do vídeo: Use /jerry next ou pule direto para
    qualquer cena com /jerry phase 1 até /jerry phase 11:
    1.  Fase 1: Jerry amigável obedecendo comandos e fazendo truques.
    2.  Fase 2: Poças de sangue surgem pela casa + olhos realistas encarando.
    3.  Fase 3: Jerry te empurra na beira de penhascos/cavernas e esmaga ossos
        na sua frente.
    4.  Fase 4: Jerry rouba sua cama, marca território, e quando você tenta
        dormir você acorda de madrugada vendo ele mexer nos seus baús.
    5.  Fase 5: Amanhecer — Jerry sentado igual um humano na grama assistindo o
        sol nascer.
    6.  Fase 6: Adoção do Tom (coleira azul) e ciúmes do Jerry.
    7.  Fase 7: Noite do assassinato — porta aberta, Tom morto numa poça de
        sangue e Jerry fingindo dormir na cama com sangue embaixo. Clique no
        Jerry (ele faz cara triste falsa) e clique com a pá no Tom para
        enterrá-lo.
    8.  Fase 8: Chuva no enterro, ataque de esqueletos e o túmulo do Tom cavado
        e vazio.
    9.  Fase 9: Trilha de sangue levando ao Bunker Subterrâneo (escada, grades
        de ferro, velas e a Sala Vermelha do Ritual com o corpo do Tom no
        centro).
    10. Fase 10: A Entidade Sombria aparece na Sala do Ritual e te persegue até
        o túnel de fuga de ardósia!
    11. Fase 11 (Final): Você volta para casa e encontra o Jerry deitado na cama
        sorrindo. Abra um baú (ou vire de costas) e olhe de volta: ele levanta
        em duas patas na cama te encarando até a tela cortar para THE END...?!
        (Use /jerry reset para sair da tela final.)
