
name: Compilar Mod Jerry Horror 1.20.1

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Python Pillow para gerar texturas HD
        run: pip install pillow

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle 8.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.3'

      - name: Gerar todo o projeto do Mod e Texturas HD
        run: |
          mkdir -p src/main/java/com/jerryhorror/mod/init
          mkdir -p src/main/java/com/jerryhorror/mod/block
          mkdir -p src/main/java/com/jerryhorror/mod/entity
          mkdir -p src/main/java/com/jerryhorror/mod/world
          mkdir -p src/main/java/com/jerryhorror/mod/story
          mkdir -p src/main/java/com/jerryhorror/mod/client/model
          mkdir -p src/main/java/com/jerryhorror/mod/client/renderer
          mkdir -p src/main/resources/META-INF
          mkdir -p src/main/resources/assets/jerryhorrormod/blockstates
          mkdir -p src/main/resources/assets/jerryhorrormod/models/block
          mkdir -p src/main/resources/assets/jerryhorrormod/models/item
          mkdir -p src/main/resources/assets/jerryhorrormod/textures/entity
          mkdir -p src/main/resources/assets/jerryhorrormod/textures/block
          mkdir -p src/main/resources/assets/jerryhorrormod/lang

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven {
                      name = 'MinecraftForge'
                      url = 'https://maven.minecraftforge.net/'
                  }
              }
          }
          plugins {
              id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
          }
          rootProject.name = 'jerryhorrormod'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'java'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }
          version = '1.0.0'
          group = 'com.jerryhorror.mod'
          base {
              archivesName = 'jerryhorrormod'
          }
          java.toolchain.languageVersion = JavaLanguageVersion.of(17)
          minecraft {
              mappings channel: 'official', version: '1.20.1'
          }
          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
          }
          jar {
              manifest {
                  attributes([
                      "Specification-Title": "jerryhorrormod",
                      "Specification-Vendor": "JerryHorror",
                      "Specification-Version": "1",
                      "Implementation-Title": project.name,
                      "Implementation-Version": project.jar.archiveVersion,
                      "Implementation-Vendor": "JerryHorror"
                  ])
              }
              finalizedBy 'reobfJar'
          }
          EOF

          cat << 'EOF' > src/main/resources/pack.mcmeta
          {
            "pack": {
              "description": "Jerry Horror Mod Resources",
              "pack_format": 15
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/META-INF/mods.toml
          modLoader="javafml"
          loaderVersion="[47,)"
          license="MIT"

          [[mods]]
          modId="jerryhorrormod"
          version="1.0.0"
          displayName="Jerry Horror Mod"
          description='''Recria todos os acontecimentos do video do Jerry e Tom no Minecraft 1.20.1 Forge.'''

          [[dependencies.jerryhorrormod]]
              modId="forge"
              mandatory=true
              versionRange="[47,)"
              ordering="NONE"
              side="BOTH"

          [[dependencies.jerryhorrormod]]
              modId="minecraft"
              mandatory=true
              versionRange="[1.20.1,1.21)"
              ordering="NONE"
              side="BOTH"
          EOF

          cat << 'EOF' > src/main/resources/assets/jerryhorrormod/lang/en_us.json
          {
            "entity.jerryhorrormod.jerry": "Jerry",
            "entity.jerryhorrormod.tom": "Tom",
            "entity.jerryhorrormod.dead_tom": "Tom",
            "entity.jerryhorrormod.shadow_demon": "Unknown Entity",
            "block.jerryhorrormod.blood_puddle": "Blood Puddle",
            "block.jerryhorrormod.ritual_floor": "Ritual Floor",
            "item.jerryhorrormod.jerry_spawn_egg": "Jerry Spawn Egg",
            "item.jerryhorrormod.tom_spawn_egg": "Tom Spawn Egg",
            "item.jerryhorrormod.dead_tom_spawn_egg": "Dead Tom Spawn Egg",
            "item.jerryhorrormod.shadow_demon_spawn_egg": "Shadow Entity Spawn Egg"
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/jerryhorrormod/lang/pt_br.json
          {
            "entity.jerryhorrormod.jerry": "Jerry",
            "entity.jerryhorrormod.tom": "Tom",
            "entity.jerryhorrormod.dead_tom": "Tom",
            "entity.jerryhorrormod.shadow_demon": "Entidade Sombria",
            "block.jerryhorrormod.blood_puddle": "Poca de Sangue",
            "block.jerryhorrormod.ritual_floor": "Chao de Ritual",
            "item.jerryhorrormod.jerry_spawn_egg": "Ovo de Jerry",
            "item.jerryhorrormod.tom_spawn_egg": "Ovo de Tom",
            "item.jerryhorrormod.dead_tom_spawn_egg": "Ovo de Tom Morto",
            "item.jerryhorrormod.shadow_demon_spawn_egg": "Ovo de Entidade Sombria"
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/jerryhorrormod/blockstates/blood_puddle.json
          {
            "variants": {
              "": { "model": "jerryhorrormod:block/blood_puddle" }
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/jerryhorrormod/blockstates/ritual_floor.json
          {
            "variants": {
              "": { "model": "jerryhorrormod:block/ritual_floor" }
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/jerryhorrormod/models/block/blood_puddle.json
          {
            "render_type": "minecraft:cutout",
            "textures": {
              "particle": "jerryhorrormod:block/blood_puddle",
              "blood": "jerryhorrormod:block/blood_puddle"
            },
            "elements": [
              {
                "from": [0, 0.25, 0],
                "to": [16, 0.25, 16],
                "faces": {
                  "up": { "uv": [0, 0, 16, 16], "texture": "#blood" },
                  "down": { "uv": [0, 0, 16, 16], "texture": "#blood" }
                }
              }
            ]
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/jerryhorrormod/models/block/ritual_floor.json
          {
            "parent": "minecraft:block/cube_all",
            "textures": {
              "all": "jerryhorrormod:block/ritual_floor"
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/jerryhorrormod/models/item/blood_puddle.json
          {
            "parent": "jerryhorrormod:block/blood_puddle"
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/jerryhorrormod/models/item/ritual_floor.json
          {
            "parent": "jerryhorrormod:block/ritual_floor"
          }
          EOF

          for egg in jerry_spawn_egg tom_spawn_egg dead_tom_spawn_egg shadow_demon_spawn_egg; do
            cat << 'EOF' > src/main/resources/assets/jerryhorrormod/models/item/${egg}.json
          {
            "parent": "item/template_spawn_egg"
          }
          EOF
          done

          cat << 'EOF' > generate_textures.py
          import random, math
          from PIL import Image, ImageDraw

          random.seed(42)

          def make_wolf_base(collar_rgb=(204, 17, 17), bloody=False):
              img = Image.new("RGBA", (256, 128), (218, 215, 210, 255))
              px = img.load()
              for y in range(128):
                  for x in range(256):
                      n = random.randint(-12, 12)
                      r = max(0, min(255, 216 + n))
                      g = max(0, min(255, 213 + n))
                      b = max(0, min(255, 208 + n))
                      px[x, y] = (r, g, b, 255)
              d = ImageDraw.Draw(img)
              # Snout (texOffs 0,10, size 3x3x4 -> 4x HD: x 0..56, y 40..68)
              d.rectangle([0, 40, 56, 68], fill=(176, 152, 128, 255))
              # Nose tip front (x 16..28, y 56..68)
              d.rectangle([16, 56, 28, 68], fill=(165, 140, 118, 255))
              d.rectangle([19, 57, 25, 62], fill=(20, 18, 18, 255))
              d.rectangle([16, 64, 28, 66], fill=(45, 38, 35, 255))
              # Ears (texOffs 16,14 -> x 64..88, y 56..68)
              d.rectangle([64, 56, 88, 68], fill=(155, 148, 140, 255))
              d.rectangle([68, 60, 74, 67], fill=(95, 88, 82, 255))
              # Collar (texOffs 42,0, size 8x6x2 -> 4x HD: x 168..248, y 0..32)
              d.rectangle([168, 0, 255, 36], fill=(collar_rgb[0], collar_rgb[1], collar_rgb[2], 255))
              for cx in range(168, 255, 4):
                  d.line([(cx, 0), (cx, 36)], fill=(max(0, collar_rgb[0]-20), max(0, collar_rgb[1]-10), max(0, collar_rgb[2]-10), 255))
              # Mane shading
              for y in range(0, 52):
                  for x in range(84, 168):
                      r, g, b, a = px[x, y]
                      px[x, y] = (max(0, r-18), max(0, g-18), max(0, b-18), 255)
              if bloody:
                  for _ in range(95):
                      bx = random.randint(0, 255)
                      by = random.randint(0, 127)
                      if 168 <= bx <= 255 and 0 <= by <= 36:
                          continue
                      br = random.randint(3, 14)
                      col = (random.randint(95, 165), random.randint(0, 12), random.randint(0, 12), 255)
                      d.ellipse([bx-br, by-br, bx+br, by+br], fill=col)
                  for _ in range(35):
                      bx = random.randint(0, 255)
                      by = random.randint(0, 120)
                      if 168 <= bx <= 255 and 0 <= by <= 36:
                          continue
                      d.line([(bx, by), (bx+random.randint(-8, 8), by+random.randint(6, 22))], fill=(120, 0, 0, 255), width=2)
              return img

          def draw_normal_eyes(img):
              d = ImageDraw.Draw(img)
              # Face front: x 16..40, y 16..40
              d.rectangle([18, 26, 22, 30], fill=(255, 255, 255, 255))
              d.rectangle([20, 26, 23, 30], fill=(15, 15, 15, 255))
              d.rectangle([34, 26, 38, 30], fill=(255, 255, 255, 255))
              d.rectangle([33, 26, 36, 30], fill=(15, 15, 15, 255))
              return img

          def draw_happy_eyes(img):
              d = ImageDraw.Draw(img)
              d.arc([17, 25, 24, 33], start=190, end=350, fill=(15, 15, 15, 255), width=2)
              d.arc([32, 25, 39, 33], start=190, end=350, fill=(15, 15, 15, 255), width=2)
              d.ellipse([16, 31, 20, 34], fill=(240, 165, 175, 255))
              d.ellipse([36, 31, 40, 34], fill=(240, 165, 175, 255))
              return img

          def draw_creepy_eyes(img):
              d = ImageDraw.Draw(img)
              # Wide photorealistic staring eyes like 03:16
              for cx in (21, 35):
                  d.ellipse([cx-5, 22, cx+5, 32], fill=(65, 58, 55, 255))
                  d.ellipse([cx-4, 23, cx+4, 31], fill=(248, 248, 245, 255))
                  d.ellipse([cx-2, 25, cx+2, 29], fill=(10, 10, 10, 255))
                  d.point((cx-1, 25), fill=(255, 255, 255, 255))
                  d.arc([cx-5, 21, cx+5, 29], start=190, end=350, fill=(35, 28, 25, 255), width=1)
              return img

          def draw_sad_eyes(img):
              d = ImageDraw.Draw(img)
              for cx in (21, 35):
                  d.ellipse([cx-4, 25, cx+4, 32], fill=(25, 22, 22, 255))
                  d.ellipse([cx-2, 26, cx+1, 29], fill=(255, 255, 255, 255))
                  d.rectangle([cx-1, 31, cx+2, 33], fill=(165, 220, 255, 255))
              d.line([(17, 25), (24, 22)], fill=(70, 62, 58, 255), width=2)
              d.line([(39, 25), (32, 22)], fill=(70, 62, 58, 255), width=2)
              return img

          def draw_smile_face(img):
              draw_creepy_eyes(img)
              d = ImageDraw.Draw(img)
              # Creepy wide grin across lower face and snout like 16:52
              d.arc([16, 29, 40, 39], start=10, end=170, fill=(10, 5, 5, 255), width=3)
              for tx in range(19, 38, 3):
                  d.line([(tx, 34), (tx, 37)], fill=(245, 245, 235, 255), width=1)
              # Grin on snout front too
              d.rectangle([16, 62, 28, 67], fill=(15, 8, 8, 255))
              for tx in range(17, 28, 2):
                  d.rectangle([tx, 63, tx, 66], fill=(245, 245, 235, 255))
              return img

          out_e = "src/main/resources/assets/jerryhorrormod/textures/entity"
          out_b = "src/main/resources/assets/jerryhorrormod/textures/block"

          draw_normal_eyes(make_wolf_base((204, 17, 17))).save(f"{out_e}/jerry_normal.png")
          draw_happy_eyes(make_wolf_base((204, 17, 17))).save(f"{out_e}/jerry_happy.png")
          draw_creepy_eyes(make_wolf_base((204, 17, 17))).save(f"{out_e}/jerry_creepy.png")
          draw_sad_eyes(make_wolf_base((204, 17, 17))).save(f"{out_e}/jerry_sad.png")
          draw_smile_face(make_wolf_base((204, 17, 17))).save(f"{out_e}/jerry_smile.png")
          draw_normal_eyes(make_wolf_base((30, 85, 204))).save(f"{out_e}/tom_normal.png")

          dead_tom = make_wolf_base((30, 85, 204), bloody=True)
          dt = ImageDraw.Draw(dead_tom)
          dt.ellipse([18, 25, 24, 31], fill=(35, 5, 5, 255))
          dt.point((20, 27), fill=(180, 160, 160, 255))
          dt.ellipse([32, 25, 38, 31], fill=(35, 5, 5, 255))
          dead_tom.save(f"{out_e}/dead_tom.png")

          # Shadow Demon (64x64)
          sh = Image.new("RGBA", (64, 64), (7, 3, 5, 255))
          sd = ImageDraw.Draw(sh)
          for _ in range(120):
              sx, sy = random.randint(0, 63), random.randint(0, 63)
              sd.point((sx, sy), fill=(random.randint(15, 45), 0, 2, 255))
          # Glowing faint red eyes on head front (8..16, 8..16)
          sd.rectangle([9, 11, 11, 12], fill=(220, 15, 15, 255))
          sd.rectangle([13, 11, 15, 12], fill=(220, 15, 15, 255))
          sh.save(f"{out_e}/shadow_demon.png")

          # Speaker Icon (64x64 transparent)
          sp = Image.new("RGBA", (64, 64), (0, 0, 0, 0))
          spd = ImageDraw.Draw(sp)
          spd.rectangle([10, 23, 22, 41], fill=(10, 10, 10, 255))
          spd.polygon([(22, 23), (38, 10), (38, 54), (22, 41)], fill=(10, 10, 10, 255))
          spd.arc([34, 18, 50, 46], start=300, end=60, fill=(10, 10, 10, 255), width=4)
          spd.arc([38, 10, 60, 54], start=300, end=60, fill=(10, 10, 10, 255), width=4)
          sp.save(f"{out_e}/speaker_icon.png")

          # Blood Puddle (64x64 transparent)
          bp = Image.new("RGBA", (64, 64), (0, 0, 0, 0))
          bpd = ImageDraw.Draw(bp)
          bpd.ellipse([14, 16, 50, 48], fill=(165, 5, 5, 240))
          bpd.ellipse([20, 22, 44, 42], fill=(115, 0, 0, 250))
          for ang in range(0, 360, 22):
              rad = math.radians(ang + random.randint(-8, 8))
              dist = random.randint(18, 30)
              ex = int(32 + math.cos(rad) * dist)
              ey = int(32 + math.sin(rad) * dist)
              bpd.line([(32, 32), (ex, ey)], fill=(175, 8, 8, 235), width=random.randint(2, 4))
              bpd.ellipse([ex-3, ey-3, ex+3, ey+3], fill=(185, 10, 10, 230))
          bp.save(f"{out_b}/blood_puddle.png")

          # Ritual Floor (64x64 glowing crimson with dark occult runes like 15:57)
          rf = Image.new("RGBA", (64, 64), (205, 12, 12, 255))
          rfd = ImageDraw.Draw(rf)
          rfd.rectangle([2, 2, 61, 61], outline=(25, 0, 0, 255), width=4)
          rfd.rectangle([12, 12, 51, 51], outline=(35, 0, 0, 255), width=3)
          rfd.ellipse([18, 18, 45, 45], outline=(20, 0, 0, 255), width=3)
          rfd.line([(0, 32), (63, 32)], fill=(30, 0, 0, 255), width=2)
          rfd.line([(32, 0), (32, 63)], fill=(30, 0, 0, 255), width=2)
          rfd.rectangle([26, 26, 37, 37], fill=(245, 30, 20, 255), outline=(15, 0, 0, 255), width=2)
          rf.save(f"{out_b}/ritual_floor.png")
          print("Todas as texturas HD foram geradas com sucesso!")
          EOF

          python3 generate_textures.py

          cat << 'EOF' > src/main/java/com/jerryhorror/mod/JerryHorrorMod.java
          package com.jerryhorror.mod;

          import com.jerryhorror.mod.entity.DeadTomEntity;
          import com.jerryhorror.mod.entity.JerryEntity;
          import com.jerryhorror.mod.entity.ShadowDemonEntity;
          import com.jerryhorror.mod.entity.TomEntity;
          import com.jerryhorror.mod.init.ModBlocks;
          import com.jerryhorror.mod.init.ModEntities;
          import com.jerryhorror.mod.init.ModItems;
          import com.jerryhorror.mod.story.StoryManager;
          import net.minecraft.world.item.CreativeModeTabs;
          import net.minecraftforge.common.MinecraftForge;
          import net.minecraftforge.event.BuildCreativeModeTabContentsEvent;
          import net.minecraftforge.event.entity.EntityAttributeCreationEvent;
          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;

          @Mod(JerryHorrorMod.MODID)
          public class JerryHorrorMod {
              public static final String MODID = "jerryhorrormod";

              public JerryHorrorMod() {
                  IEventBus modEventBus = FMLJavaModLoadingContext.get().getModEventBus();
                  ModBlocks.BLOCKS.register(modEventBus);
                  ModItems.ITEMS.register(modEventBus);
                  ModEntities.ENTITIES.register(modEventBus);
                  modEventBus.addListener(this::registerAttributes);
                  modEventBus.addListener(this::addCreative);
                  MinecraftForge.EVENT_BUS.register(new StoryManager());
              }

              private void registerAttributes(EntityAttributeCreationEvent event) {
                  event.put(ModEntities.JERRY.get(), JerryEntity.createAttributes().build());
                  event.put(ModEntities.TOM.get(), TomEntity.createAttributes().build());
                  event.put(ModEntities.DEAD_TOM.get(), DeadTomEntity.createAttributes().build());
                  event.put(ModEntities.SHADOW_DEMON.get(), ShadowDemonEntity.createAttributes().build());
              }

              private void addCreative(BuildCreativeModeTabContentsEvent event) {
                  if (event.getTabKey() == CreativeModeTabs.SPAWN_EGGS) {
                      event.accept(ModItems.JERRY_SPAWN_EGG);
                      event.accept(ModItems.TOM_SPAWN_EGG);
                      event.accept(ModItems.DEAD_TOM_SPAWN_EGG);
                      event.accept(ModItems.SHADOW_DEMON_SPAWN_EGG);
                  }
                  if (event.getTabKey() == CreativeModeTabs.BUILDING_BLOCKS) {
                      event.accept(ModItems.BLOOD_PUDDLE_ITEM);
                      event.accept(ModItems.RITUAL_FLOOR_ITEM);
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/jerryhorror/mod/block/BloodPuddleBlock.java
          package com.jerryhorror.mod.block;

          import net.minecraft.core.BlockPos;
          import net.minecraft.world.level.BlockGetter;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.phys.shapes.CollisionContext;
          import net.minecraft.world.phys.shapes.VoxelShape;

          public class BloodPuddleBlock extends Block {
              private static final VoxelShape SHAPE = Block.box(0.0D, 0.0D, 0.0D, 16.0D, 1.0D, 16.0D);

              public BloodPuddleBlock(Properties props) {
                  super(props);
              }

              @Override
              public VoxelShape getShape(BlockState state, BlockGetter level, BlockPos pos, CollisionContext context) {
                  return SHAPE;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/jerryhorror/mod/init/ModBlocks.java
          package com.jerryhorror.mod.init;

          import com.jerryhorror.mod.JerryHorrorMod;
          import com.jerryhorror.mod.block.BloodPuddleBlock;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.SoundType;
          import net.minecraft.world.level.block.state.BlockBehaviour;
          import net.minecraft.world.level.material.MapColor;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;
          import net.minecraftforge.registries.RegistryObject;

          public class ModBlocks {
              public static final DeferredRegister<Block> BLOCKS = DeferredRegister.create(ForgeRegistries.BLOCKS, JerryHorrorMod.MODID);

              public static final RegistryObject<Block> BLOOD_PUDDLE = BLOCKS.register("blood_puddle",
                      () -> new BloodPuddleBlock(BlockBehaviour.Properties.of()
                              .mapColor(MapColor.COLOR_RED)
                              .noCollission()
                              .noOcclusion()
                              .instabreak()
                              .sound(SoundType.SLIME_BLOCK)));

              public static final RegistryObject<Block> RITUAL_FLOOR = BLOCKS.register("ritual_floor",
                      () -> new Block(BlockBehaviour.Properties.of()
                              .mapColor(MapColor.NETHER)
                              .strength(3.0F)
                              .lightLevel(s -> 12)
                              .sound(SoundType.STONE)));
          }
          EOF

          cat << 'EOF' > src/main/java/com/jerryhorror/mod/init/ModEntities.java
          package com.jerryhorror.mod.init;

          import com.jerryhorror.mod.JerryHorrorMod;
          import com.jerryhorror.mod.entity.DeadTomEntity;
          import com.jerryhorror.mod.entity.JerryEntity;
          import com.jerryhorror.mod.entity.ShadowDemonEntity;
          import com.jerryhorror.mod.entity.TomEntity;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.MobCategory;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;
          import net.minecraftforge.registries.RegistryObject;

          public class ModEntities {
              public static final DeferredRegister<EntityType<?>> ENTITIES = DeferredRegister.create(ForgeRegistries.ENTITY_TYPES, JerryHorrorMod.MODID);

              public static final RegistryObject<EntityType<JerryEntity>> JERRY = ENTITIES.register("jerry",
                      () -> EntityType.Builder.of(JerryEntity::new, MobCategory.CREATURE).sized(0.6F, 0.85F).build("jerry"));

              public static final RegistryObject<EntityType<TomEntity>> TOM = ENTITIES.register("tom",
                      () -> EntityType.Builder.of(TomEntity::new, MobCategory.CREATURE).sized(0.6F, 0.85F).build("tom"));

              public static final RegistryObject<EntityType<DeadTomEntity>> DEAD_TOM = ENTITIES.register("dead_tom",
                      () -> EntityType.Builder.of(DeadTomEntity::new, MobCategory.MISC).sized(1.1F, 0.35F).build("dead_tom"));

              public static final RegistryObject<EntityType<ShadowDemonEntity>> SHADOW_DEMON = ENTITIES.register("shadow_demon",
                      () -> EntityType.Builder.of(ShadowDemonEntity::new, MobCategory.MONSTER).sized(0.7F, 2.4F).build("shadow_demon"));
