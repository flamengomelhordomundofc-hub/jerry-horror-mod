          cat << 'EOF' > src/main/java/com/jerryhorror/mod/entity/JerryEntity.java
          package com.jerryhorror.mod.entity;

          import com.jerryhorror.mod.story.StoryManager;
          import net.minecraft.core.particles.DustParticleOptions;
          import net.minecraft.core.particles.ParticleTypes;
          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.network.chat.Component;
          import net.minecraft.network.syncher.EntityDataAccessor;
          import net.minecraft.network.syncher.EntityDataSerializers;
          import net.minecraft.network.syncher.SynchedEntityData;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.damagesource.DamageSource;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.Mob;
          import net.minecraft.world.entity.PathfinderMob;
          import net.minecraft.world.entity.ai.attributes.AttributeSupplier;
          import net.minecraft.world.entity.ai.attributes.Attributes;
          import net.minecraft.world.entity.ai.goal.FloatGoal;
          import net.minecraft.world.entity.ai.goal.LookAtPlayerGoal;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.Items;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.phys.Vec3;
          import org.joml.Vector3f;

          public class JerryEntity extends PathfinderMob {
              public static final int FACE_NORMAL = 0;
              public static final int FACE_HAPPY = 1;
              public static final int FACE_CREEPY = 2;
              public static final int FACE_SAD = 3;
              public static final int FACE_SMILE = 4;

              public static final int ANIM_NORMAL = 0;
              public static final int ANIM_ROLL_OVER = 1;
              public static final int ANIM_SLEEP_BED = 2;
              public static final int ANIM_MARK_TERRITORY = 3;
              public static final int ANIM_DIG_CHEST = 4;
              public static final int ANIM_HUMAN_SIT = 5;
              public static final int ANIM_STAND_UPRIGHT = 6;
              public static final int ANIM_THE_END = 7;

              private static final EntityDataAccessor<Integer> DATA_FACE = SynchedEntityData.defineId(JerryEntity.class, EntityDataSerializers.INT);
              private static final EntityDataAccessor<Integer> DATA_ANIM = SynchedEntityData.defineId(JerryEntity.class, EntityDataSerializers.INT);
              private static final EntityDataAccessor<Integer> DATA_SPEAKER = SynchedEntityData.defineId(JerryEntity.class, EntityDataSerializers.INT);
              private static final EntityDataAccessor<Boolean> DATA_SITTING = SynchedEntityData.defineId(JerryEntity.class, EntityDataSerializers.BOOLEAN);

              private int animTimer = 0;
              private int endStareTimer = 0;
              private int pushCooldown = 0;

              public JerryEntity(EntityType<? extends PathfinderMob> type, Level level) {
                  super(type, level);
                  this.setCustomName(Component.literal("Jerry"));
                  this.setCustomNameVisible(true);
                  this.setPersistenceRequired();
              }

              public static AttributeSupplier.Builder createAttributes() {
                  return Mob.createMobAttributes()
                          .add(Attributes.MAX_HEALTH, 200.0D)
                          .add(Attributes.MOVEMENT_SPEED, 0.34D)
                          .add(Attributes.ATTACK_DAMAGE, 4.0D);
              }

              @Override
              protected void defineSynchedData() {
                  super.defineSynchedData();
                  this.entityData.define(DATA_FACE, FACE_NORMAL);
                  this.entityData.define(DATA_ANIM, ANIM_NORMAL);
                  this.entityData.define(DATA_SPEAKER, 0);
                  this.entityData.define(DATA_SITTING, false);
              }

              @Override
              protected void registerGoals() {
                  this.goalSelector.addGoal(0, new FloatGoal(this));
                  this.goalSelector.addGoal(2, new LookAtPlayerGoal(this, Player.class, 24.0F));
              }

              public int getFaceState() { return this.entityData.get(DATA_FACE); }
              public void setFaceState(int face) { this.entityData.set(DATA_FACE, face); }

              public int getAnimState() { return this.entityData.get(DATA_ANIM); }
              public void setAnimState(int anim) { this.entityData.set(DATA_ANIM, anim); }

              public int getSpeakerTimer() { return this.entityData.get(DATA_SPEAKER); }
              public void setSpeakerTimer(int t) { this.entityData.set(DATA_SPEAKER, t); }

              public boolean isJerrySitting() { return this.entityData.get(DATA_SITTING); }
              public void setJerrySitting(boolean sit) { this.entityData.set(DATA_SITTING, sit); }

              public void triggerRollOver(boolean happy) {
                  this.setAnimState(ANIM_ROLL_OVER);
                  if (happy) this.setFaceState(FACE_HAPPY);
                  this.animTimer = 50;
                  this.playSound(SoundEvents.WOLF_AMBIENT, 1.0F, 1.2F);
              }

              @Override
              public void tick() {
                  super.tick();
                  if (!this.level().isClientSide) {
                      if (getSpeakerTimer() > 0) setSpeakerTimer(getSpeakerTimer() - 1);
                      if (pushCooldown > 0) pushCooldown--;

                      int anim = getAnimState();
                      if (animTimer > 0) {
                          animTimer--;
                          if (animTimer == 0 && anim == ANIM_ROLL_OVER) {
                              setAnimState(ANIM_NORMAL);
                              if (StoryManager.currentPhase <= 1) setFaceState(FACE_NORMAL);
                          }
                      }

                      if (anim == ANIM_MARK_TERRITORY && this.tickCount % 3 == 0 && this.level() instanceof ServerLevel sl) {
                          sl.sendParticles(new DustParticleOptions(new Vector3f(0.75F, 0.55F, 0.12F), 1.3F),
                                  getX(), getY() + 0.25D, getZ(), 6, 0.25D, 0.1D, 0.25D, 0.02D);
                      }

                      Player nearest = this.level().getNearestPlayer(this, 24.0D);
                      if (nearest != null) {
                          // Seguir o jogador apenas na Fase 1 (quando nao esta sentado/fazendo truque)
                          if (StoryManager.currentPhase <= 1 && !isJerrySitting() && anim == ANIM_NORMAL) {
                              if (this.distanceTo(nearest) > 4.5D) {
                                  this.getNavigation().moveTo(nearest, 1.15D);
                              }
                          }

                          // Fase 3: Empurrar o jogador na beira de penhasco/caverna
                          if (StoryManager.currentPhase == 3 && pushCooldown == 0 && this.distanceTo(nearest) < 2.6D) {
                              Vec3 push = nearest.position().subtract(this.position()).normalize().scale(1.35D);
                              nearest.setDeltaMovement(push.x, 0.42D, push.z);
                              nearest.hurtMarked = true;
                              this.playSound(SoundEvents.WOLF_GROWL, 1.2F, 0.7F);
                              if (nearest instanceof ServerPlayer sp) {
                                  sp.displayClientMessage(Component.literal("§cVoce escorregou...!"), true);
                              }
                              pushCooldown = 140;
                          }

                          // Fase 11: Quando Jerry fica em pe na cama encarando o jogador -> THE END...?
                          if (anim == ANIM_STAND_UPRIGHT) {
                              this.getLookControl().setLookAt(nearest, 30.0F, 30.0F);
                              this.setDeltaMovement(Vec3.ZERO);
                              if (this.distanceTo(nearest) < 10.0D) {
                                  endStareTimer++;
                                  if (endStareTimer == 1) {
                                      this.playSound(SoundEvents.AMBIENT_CAVE.value(), 2.0F, 0.5F);
                                  }
                                  if (endStareTimer >= 65) {
                                      setAnimState(ANIM_THE_END);
                                      this.playSound(SoundEvents.WARDEN_SONIC_BOOM, 1.5F, 0.4F);
                                  }
                              }
                          }

                          // Travar movimento nas poses cinematograficas
                          if (anim == ANIM_SLEEP_BED || anim == ANIM_HUMAN_SIT || anim == ANIM_DIG_CHEST || anim == ANIM_THE_END) {
                              this.getNavigation().stop();
                              this.setDeltaMovement(0, this.getDeltaMovement().y, 0);
                          }
                      }
                  }
              }

              @Override
              public InteractionResult mobInteract(Player player, InteractionHand hand) {
                  if (!this.level().isClientSide && hand == InteractionHand.MAIN_HAND) {
                      ItemStack stack = player.getItemInHand(hand);
                      if (stack.is(Items.BONE)) {
                          if (StoryManager.currentPhase == 3) {
                              // Jerry esmaga o osso agressivamente como em 05:10
                              stack.shrink(1);
                              this.playSound(SoundEvents.SKELETON_HURT, 1.2F, 0.6F);
                              if (this.level() instanceof ServerLevel sl) {
                                  sl.sendParticles(ParticleTypes.POOF, getX(), getY() + 0.5D, getZ(), 20, 0.3D, 0.2D, 0.3D, 0.08D);
                              }
                              player.sendSystemMessage(Component.literal("§7Jerry esmagou o osso em pedacos e continuou te encarando..."));
                              return InteractionResult.SUCCESS;
                          } else {
                              stack.shrink(1);
                              this.playSound(SoundEvents.GENERIC_EAT, 1.0F, 1.1F);
                              if (StoryManager.currentPhase <= 1) setFaceState(FACE_HAPPY);
                              if (this.level() instanceof ServerLevel sl) {
                                  sl.sendParticles(ParticleTypes.HEART, getX(), getY() + 0.8D, getZ(), 6, 0.3D, 0.3D, 0.3D, 0.02D);
                              }
                              return InteractionResult.SUCCESS;
                          }
                      }

                      if (StoryManager.currentPhase == 4 && getAnimState() == ANIM_SLEEP_BED) {
                          setAnimState(ANIM_MARK_TERRITORY);
                          this.playSound(SoundEvents.WOLF_GROWL, 1.0F, 0.7F);
                          player.sendSystemMessage(Component.literal("§eJerry nao quer sair da sua cama... Ele esta marcando territorio."));
                          return InteractionResult.SUCCESS;
                      }

                      if (StoryManager.currentPhase == 7 && getAnimState() == ANIM_SLEEP_BED) {
                          setAnimState(ANIM_NORMAL);
                          setFaceState(FACE_SAD);
                          this.playSound(SoundEvents.WOLF_WHINE, 1.0F, 0.9F);
                          player.sendSystemMessage(Component.literal("§bJerry acordou e parece 'triste' pelo Tom... Use uma pa no corpo do Tom para enterra-lo."));
                          return InteractionResult.SUCCESS;
                      }

                      if (StoryManager.currentPhase <= 1) {
                          setJerrySitting(!isJerrySitting());
                          return InteractionResult.SUCCESS;
                      }
                  }
                  return super.mobInteract(player, hand);
              }

              @Override
              public boolean hurt(DamageSource source, float amount) {
                  if (StoryManager.currentPhase >= 2) {
                      this.playSound(SoundEvents.WOLF_GROWL, 1.2F, 0.5F);
                      return false;
                  }
                  return super.hurt(source, amount);
              }

              @Override
              public void addAdditionalSaveData(CompoundTag tag) {
                  super.addAdditionalSaveData(tag);
                  tag.putInt("JerryFace", getFaceState());
                  tag.putInt("JerryAnim", getAnimState());
                  tag.putBoolean("JerrySit", isJerrySitting());
              }

              @Override
              public void readAdditionalSaveData(CompoundTag tag) {
                  super.readAdditionalSaveData(tag);
                  if (tag.contains("JerryFace")) setFaceState(tag.getInt("JerryFace"));
                  if (tag.contains("JerryAnim")) setAnimState(tag.getInt("JerryAnim"));
                  if (tag.contains("JerrySit")) setJerrySitting(tag.getBoolean("JerrySit"));
              }
          }
