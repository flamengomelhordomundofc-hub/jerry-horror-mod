          package com.jerryhorror.mod.client;

          import com.jerryhorror.mod.JerryHorrorMod;
          import com.jerryhorror.mod.entity.JerryEntity;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.client.event.RenderGuiOverlayEvent;
          import net.minecraftforge.client.gui.overlay.VanillaGuiOverlay;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          @Mod.EventBusSubscriber(modid = JerryHorrorMod.MODID, bus = Mod.EventBusSubscriber.Bus.FORGE, value = Dist.CLIENT)
          public class ClientHudOverlay {
              @SubscribeEvent
              public static void onRenderGui(RenderGuiOverlayEvent.Post event) {
                  if (event.getOverlay() != VanillaGuiOverlay.HOTBAR.type()) return;
                  Minecraft mc = Minecraft.getInstance();
                  if (mc.player == null || mc.level == null) return;
                  boolean ending = !mc.level.getEntitiesOfClass(JerryEntity.class, mc.player.getBoundingBox().inflate(24.0D),
                          j -> j.getAnimState() == JerryEntity.ANIM_THE_END).isEmpty();
                  if (ending) {
                      GuiGraphics gg = event.getGuiGraphics();
                      int w = mc.getWindow().getGuiScaledWidth();
                      int h = mc.getWindow().getGuiScaledHeight();
                      gg.fill(0, 0, w, h, 0xFF000000);
                      gg.drawCenteredString(mc.font, "THE END...?", w / 2, h / 2 - 4, 0xAAAAAA);
                  }
              }
          }
