          package com.jerryhorror.mod.client.renderer;

          import com.jerryhorror.mod.JerryHorrorMod;
          import com.jerryhorror.mod.client.model.JerryModel;
          import com.jerryhorror.mod.entity.JerryEntity;
          import com.mojang.blaze3d.vertex.PoseStack;
          import com.mojang.blaze3d.vertex.VertexConsumer;
          import net.minecraft.client.renderer.MultiBufferSource;
          import net.minecraft.client.renderer.RenderType;
          import net.minecraft.client.renderer.entity.EntityRendererProvider;
          import net.minecraft.client.renderer.entity.MobRenderer;
          import net.minecraft.client.renderer.texture.OverlayTexture;
          import net.minecraft.resources.ResourceLocation;
          import org.joml.Matrix3f;
          import org.joml.Matrix4f;

          public class JerryRenderer extends MobRenderer<JerryEntity, JerryModel<JerryEntity>> {
              private static final ResourceLocation TEX_NORMAL = new ResourceLocation(JerryHorrorMod.MODID, "textures/entity/jerry_normal.png");
              private static final ResourceLocation TEX_HAPPY = new ResourceLocation(JerryHorrorMod.MODID, "textures/entity/jerry_happy.png");
              private static final ResourceLocation TEX_CREEPY = new ResourceLocation(JerryHorrorMod.MODID, "textures/entity/jerry_creepy.png");
              private static final ResourceLocation TEX_SAD = new ResourceLocation(JerryHorrorMod.MODID, "textures/entity/jerry_sad.png");
              private static final ResourceLocation TEX_SMILE = new ResourceLocation(JerryHorrorMod.MODID, "textures/entity/jerry_smile.png");
              private static final ResourceLocation SPEAKER_TEX = new ResourceLocation(JerryHorrorMod.MODID, "textures/entity/speaker_icon.png");

              public JerryRenderer(EntityRendererProvider.Context ctx) {
                  super(ctx, new JerryModel<>(ctx.bakeLayer(JerryModel.LAYER_LOCATION)), 0.5F);
              }

              @Override
              public ResourceLocation getTextureLocation(JerryEntity entity) {
                  return switch (entity.getFaceState()) {
                      case JerryEntity.FACE_HAPPY -> TEX_HAPPY;
                      case JerryEntity.FACE_CREEPY -> TEX_CREEPY;
                      case JerryEntity.FACE_SAD -> TEX_SAD;
                      case JerryEntity.FACE_SMILE -> TEX_SMILE;
                      default -> TEX_NORMAL;
                  };
              }

              @Override
              public void render(JerryEntity entity, float yaw, float partialTicks, PoseStack poseStack, MultiBufferSource buffer, int packedLight) {
                  super.render(entity, yaw, partialTicks, poseStack, buffer, packedLight);
                  if (entity.getSpeakerTimer() > 0) {
                      poseStack.pushPose();
                      poseStack.translate(0.0D, entity.getBbHeight() + 0.65D, 0.0D);
                      poseStack.mulPose(this.entityRenderDispatcher.cameraOrientation());
                      Matrix4f mat = poseStack.last().pose();
                      Matrix3f norm = poseStack.last().normal();
                      VertexConsumer vc = buffer.getBuffer(RenderType.entityCutoutNoCull(SPEAKER_TEX));
                      float s = 0.35F;
                      vc.vertex(mat, -s, -s, 0.0F).color(255, 255, 255, 255).uv(0.0F, 1.0F).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(15728880).normal(norm, 0.0F, 1.0F, 0.0F).endVertex();
                      vc.vertex(mat,  s, -s, 0.0F).color(255, 255, 255, 255).uv(1.0F, 1.0F).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(15728880).normal(norm, 0.0F, 1.0F, 0.0F).endVertex();
                      vc.vertex(mat,  s,  s, 0.0F).color(255, 255, 255, 255).uv(1.0F, 0.0F).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(15728880).normal(norm, 0.0F, 1.0F, 0.0F).endVertex();
                      vc.vertex(mat, -s,  s, 0.0F).color(255, 255, 255, 255).uv(0.0F, 0.0F).overlayCoords(OverlayTexture.NO_OVERLAY).uv2(15728880).normal(norm, 0.0F, 1.0F, 0.0F).endVertex();
                      poseStack.popPose();
                  }
              }
          }
