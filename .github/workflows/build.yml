              // Domesticar lobo vanilla com osso transforma ele no Jerry (ou no Tom na Fase 6+)
              @SubscribeEvent
              public void onEntityInteract(PlayerInteractEvent.EntityInteract event) {
                  if (event.getLevel().isClientSide) return;
                  if (event.getTarget() instanceof Wolf wolf && event.getItemStack().is(Items.BONE) && event.getEntity() instanceof ServerPlayer sp) {
                      ServerLevel sl = sp.serverLevel();
                      if (findJerry(sl, sp.blockPosition()) == null) {
                          BlockPos pos = wolf.blockPosition();
                          wolf.discard();
                          JerryEntity j = spawnJerry(sl, pos);
                          j.setFaceState(JerryEntity.FACE_HAPPY);
                          sp.sendSystemMessage(Component.literal("§aVoce domesticou o Jerry! Diga no chat: 'rolar', 'flor', 'madeira' ou 'ferro'!"));
                          event.setCanceled(true);
                      } else if (currentPhase >= 5 && findTom(sl, sp.blockPosition()) == null) {
                          BlockPos pos = wolf.blockPosition();
                          wolf.discard();
                          spawnTom(sl, pos);
                          sp.sendSystemMessage(Component.literal("§bVoce domesticou o Tom (coleira azul)!"));
                          event.setCanceled(true);
                      }
                  }
              }

              // Reconhecimento de voz via Chat (Portugues e Ingles) com icone de alto-falante
              @SubscribeEvent
              public void onChat(ServerChatEvent event) {
                  ServerPlayer sp = event.getPlayer();
                  ServerLevel sl = sp.serverLevel();
                  String msg = event.getRawText().toLowerCase();
                  JerryEntity jerry = findJerry(sl, sp.blockPosition());
                  TomEntity tom = findTom(sl, sp.blockPosition());

                  if (jerry != null) {
                      if (msg.contains("roll") || msg.contains("rolar") || msg.contains("gira")) {
                          jerry.setSpeakerTimer(60);
                          jerry.triggerRollOver(currentPhase <= 1);
                          if (currentPhase == 6) {
                              jerry.setFaceState(JerryEntity.FACE_CREEPY);
                              sp.sendSystemMessage(Component.literal("§7Jerry rolou... mas continuou te encarando com aqueles olhos."));
                          }
                      } else if (msg.contains("flower") || msg.contains("flor")) {
                          jerry.setSpeakerTimer(60);
                          if (currentPhase <= 1) {
                              jerry.setFaceState(JerryEntity.FACE_HAPPY);
                              dropItem(sl, jerry.blockPosition(), new ItemStack(Items.POPPY, 1));
                              sp.sendSystemMessage(Component.literal("§aJerry trouxe uma flor para voce!"));
                          } else {
                              jerry.setFaceState(JerryEntity.FACE_CREEPY);
                              sp.sendSystemMessage(Component.literal("§7Jerry ignorou o comando e ficou te encarando..."));
                          }
                      } else if (msg.contains("wood") || msg.contains("madeira")) {
                          jerry.setSpeakerTimer(60);
                          if (currentPhase <= 1) {
                              dropItem(sl, jerry.blockPosition(), new ItemStack(Items.OAK_LOG, 16));
                              sp.sendSystemMessage(Component.literal("§aJerry coletou 16 madeiras!"));
                          }
                      } else if (msg.contains("iron") || msg.contains("ferro")) {
                          jerry.setSpeakerTimer(60);
                          if (currentPhase <= 2) {
                              dropItem(sl, jerry.blockPosition(), new ItemStack(Items.RAW_IRON, 12));
                              sp.sendSystemMessage(Component.literal("§aJerry minerou ferro para voce!"));
                          }
                      } else if (msg.contains("blood") || msg.contains("sangue") || msg.contains("what is this") || msg.contains("que isso")) {
                          jerry.setSpeakerTimer(60);
                          jerry.setFaceState(JerryEntity.FACE_CREEPY);
                          jerry.setAnimState(JerryEntity.ANIM_NORMAL);
                          sl.playSound(null, jerry.blockPosition(), SoundEvents.AMBIENT_CAVE.value(), SoundSource.HOSTILE, 1.5F, 0.6F);
