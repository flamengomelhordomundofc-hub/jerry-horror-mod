          package com.jerryhorror.mod.world;

          import com.jerryhorror.mod.entity.DeadTomEntity;
          import com.jerryhorror.mod.init.ModBlocks;
          import com.jerryhorror.mod.init.ModEntities;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Direction;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.DoorBlock;
          import net.minecraft.world.level.block.LadderBlock;
          import net.minecraft.world.level.block.StairBlock;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.block.state.properties.BlockStateProperties;
          import net.minecraft.world.level.block.state.properties.DoubleBlockHalf;

          public class BunkerBuilder {
              public static BlockPos lastRitualCenter = null;

              public static BlockPos buildBunker(ServerLevel level, BlockPos entrance) {
                  // Entrada do bunker (15:25)
                  for (int dx = -1; dx <= 1; dx++) {
                      level.setBlock(entrance.offset(dx, 0, -1), Blocks.COBBLESTONE.defaultBlockState(), 3);
                      level.setBlock(entrance.offset(dx, 1, -1), Blocks.COBBLESTONE.defaultBlockState(), 3);
                  }
                  level.setBlock(entrance.above(), Blocks.COBBLESTONE_SLAB.defaultBlockState(), 3);
                  level.setBlock(entrance, Blocks.DARK_OAK_TRAPDOOR.defaultBlockState(), 3);

                  // Escada descendo 10 blocos para o Sul (+Z)
                  for (int i = 1; i <= 10; i++) {
                      BlockPos step = entrance.offset(0, -i, i);
                      for (int dx = -1; dx <= 1; dx++) {
                          for (int dy = -1; dy <= 3; dy++) {
                              boolean wall = (dx == -1 || dx == 1 || dy == -1 || dy == 3);
                              level.setBlock(step.offset(dx, dy, 0),
                                      wall ? Blocks.COBBLESTONE.defaultBlockState() : Blocks.AIR.defaultBlockState(), 3);
                          }
                      }
                      level.setBlock(step, Blocks.OAK_STAIRS.defaultBlockState().setValue(StairBlock.FACING, Direction.NORTH), 3);
                  }

                  // Corredor com grades de ferro e velas (15:47)
                  BlockPos hallStart = entrance.offset(0, -10, 11);
                  for (int z = 0; z < 8; z++) {
                      for (int x = -2; x <= 2; x++) {
                          for (int y = -1; y <= 3; y++) {
                              BlockPos p = hallStart.offset(x, y, z);
                              if (y == -1 || y == 3 || x == -2 || x == 2) {
                                  level.setBlock(p, Blocks.STONE_BRICKS.defaultBlockState(), 3);
                              } else {
                                  level.setBlock(p, Blocks.AIR.defaultBlockState(), 3);
                              }
                          }
                      }
                      if (z % 2 == 1) {
                          level.setBlock(hallStart.offset(-1, 1, z), Blocks.IRON_BARS.defaultBlockState(), 3);
                          level.setBlock(hallStart.offset(-1, 2, z), Blocks.IRON_BARS.defaultBlockState(), 3);
                          BlockState litCandle = Blocks.CANDLE.defaultBlockState().setValue(BlockStateProperties.LIT, true);
                          level.setBlock(hallStart.offset(1, 1, z), litCandle, 3);
                      }
                  }

                  // Porta para a sala do ritual (15:55)
                  BlockPos doorPos = hallStart.offset(0, 0, 8);
                  level.setBlock(doorPos, Blocks.SPRUCE_DOOR.defaultBlockState().setValue(DoorBlock.HALF, DoubleBlockHalf.LOWER), 3);
                  level.setBlock(doorPos.above(), Blocks.SPRUCE_DOOR.defaultBlockState().setValue(DoorBlock.HALF, DoubleBlockHalf.UPPER), 3);

                  // Sala do Ritual Vermelha 11x6x11 (15:57)
                  BlockPos roomCenter = hallStart.offset(0, 0, 14);
                  lastRitualCenter = roomCenter;
                  for (int x = -5; x <= 5; x++) {
                      for (int z = -5; z <= 5; z++) {
                          for (int y = -1; y <= 5; y++) {
                              BlockPos p = roomCenter.offset(x, y, z);
                              if (y == -1) {
                                  level.setBlock(p, ModBlocks.RITUAL_FLOOR.get().defaultBlockState(), 3);
                              } else if (y == 5 || Math.abs(x) == 5 || Math.abs(z) == 5) {
                                  if (z == -5 && x == 0 && (y == 0 || y == 1)) continue;
                                  if (z == 5 && x == 0 && (y == 0 || y == 1)) continue;
                                  level.setBlock(p, Blocks.NETHER_BRICKS.defaultBlockState(), 3);
                              } else {
                                  level.setBlock(p, Blocks.AIR.defaultBlockState(), 3);
                              }
                          }
                      }
                  }

                  // Pilares vermelhos e teias de aranha
                  int[][] pillars = {{-3, -3}, {3, -3}, {-3, 3}, {3, 3}};
                  for (int[] c : pillars) {
                      for (int y = 0; y <= 4; y++) {
                          level.setBlock(roomCenter.offset(c[0], y, c[1]), Blocks.REDSTONE_BLOCK.defaultBlockState(), 3);
                      }
                      level.setBlock(roomCenter.offset(c[0], 4, c[1] > 0 ? c[1] - 1 : c[1] + 1), Blocks.COBWEB.defaultBlockState(), 3);
                  }
                  level.setBlock(roomCenter.offset(0, 4, 0), Blocks.COBWEB.defaultBlockState(), 3);

                  // Altar central com sangue e corpo do Tom
                  for (int x = -1; x <= 1; x++) {
                      for (int z = -1; z <= 1; z++) {
                          level.setBlock(roomCenter.offset(x, 0, z), ModBlocks.BLOOD_PUDDLE.get().defaultBlockState(), 3);
                      }
                  }
                  DeadTomEntity deadTom = ModEntities.DEAD_TOM.get().create(level);
                  if (deadTom != null) {
                      deadTom.moveTo(roomCenter.getX() + 0.5D, roomCenter.getY(), roomCenter.getZ() + 0.5D, 0.0F, 0.0F);
                      level.addFreshEntity(deadTom);
                  }

                  // Tunel de fuga de Ardosia Profunda subindo de volta para a superficie (16:22)
                  BlockPos escapeStart = roomCenter.offset(0, 0, 6);
                  for (int z = 0; z < 6; z++) {
                      for (int x = -1; x <= 1; x++) {
                          for (int y = -1; y <= 2; y++) {
                              boolean w = (x == -1 || x == 1 || y == -1 || y == 2);
                              level.setBlock(escapeStart.offset(x, y, z),
                                      w ? Blocks.DEEPSLATE_BRICKS.defaultBlockState() : Blocks.AIR.defaultBlockState(), 3);
                          }
                      }
                  }
                  BlockPos shaft = escapeStart.offset(0, 0, 5);
                  for (int y = 0; y <= 13; y++) {
                      for (int x = -1; x <= 1; x++) {
                          for (int z = -1; z <= 1; z++) {
                              BlockPos p = shaft.offset(x, y, z);
                              if (x == 0 && z == 0) {
                                  level.setBlock(p, Blocks.LADDER.defaultBlockState().setValue(LadderBlock.FACING, Direction.NORTH), 3);
                              } else if (y < 11) {
                                  level.setBlock(p, Blocks.DEEPSLATE_BRICKS.defaultBlockState(), 3);
                              }
                          }
                      }
                  }
                  return roomCenter;
              }
          }
