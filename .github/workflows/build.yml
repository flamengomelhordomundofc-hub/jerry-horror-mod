          import net.minecraftforge.client.event.EntityRenderersEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          @Mod.EventBusSubscriber(modid = JerryHorrorMod.MODID, bus = Mod.EventBusSubscriber.Bus.MOD, value = Dist.CLIENT)
          public class ClientModEvents {
              @SubscribeEvent
              public static void registerRenderers(EntityRenderersEvent.RegisterRenderers event) {
                  event.registerEntityRenderer(ModEntities.JERRY.get(), JerryRenderer::new);
                  event.registerEntityRenderer(ModEntities.TOM.get(), TomRenderer::new);
                  event.registerEntityRenderer(ModEntities.DEAD_TOM.get(), DeadTomRenderer::new);
                  event.registerEntityRenderer(ModEntities.SHADOW_DEMON.get(), ShadowDemonRenderer::new);
              }

              @SubscribeEvent
              public static void registerLayers(EntityRenderersEvent.RegisterLayerDefinitions event) {
                  event.registerLayerDefinition(JerryModel.LAYER_LOCATION, JerryModel::createBodyLayer);
                  event.registerLayerDefinition(DeadTomModel.LAYER_LOCATION, DeadTomModel::createBodyLayer);
                  event.registerLayerDefinition(ShadowDemonModel.LAYER_LOCATION, ShadowDemonModel::createBodyLayer);
              }
          }
